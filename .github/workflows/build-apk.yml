name: Build APK

# ⚠️ 这个 workflow 是「WebView 壳」时代的遗留，**在 CI 上跑不出独立版的 APK**。
#
# 原因：独立版的构建分两步 —— 先 `tools/fetch-runtime.sh` 收资产（Node 运行时 +
# 上游 DeepWrite 的渲染层产物 + 依赖闭包），再 `build.sh`。而第二步的第 ④ 步要求
# `build/apk/assets` 存在（build.sh 里会直接报「缺少 build/apk」并退出），
# 那份资产来自**上游 DeepWrite 工作区**（`apps/desktop/out-web`），不在本仓库里。
# 也就是说本仓库自带不了构建输入，CI 无论怎么配都构建不出这个 APK。
#
# 所以这里只保留手动触发，不再挂在 push 上 —— 否则每次改 src/ 或 tools/ 都会
# 触发一个注定失败的 job，把人训练成「红叉是正常的」。
#
# 真正的构建方式：在有上游 DeepWrite 工作区的机器上（就是那台 Android 容器）
#   RUNTIME_CACHE=./build/runtime-cache bash tools/fetch-runtime.sh
#   bash build.sh
# 详见 README「构建」一节。
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: 准备 JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: 检查 Android SDK
        run: |
          SDK="${ANDROID_SDK_ROOT:-$ANDROID_HOME}"
          echo "ANDROID_SDK_ROOT=$SDK" >> "$GITHUB_ENV"
          echo "build-tools:"; ls "$SDK/build-tools"
          echo "platforms:";   ls "$SDK/platforms"

      - name: 还原签名密钥
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            printf '%s' "$KEYSTORE_BASE64" | base64 -d > deepwrite.keystore
            echo "已还原仓库签名密钥（同仓库的后续版本可覆盖升级）"
          else
            echo "没有配置 KEYSTORE_BASE64：本次会用临时密钥签名，只能全新安装。"
            echo "要固定签名，把 keystore 用 base64 存进仓库 secret 即可。"
          fi

      - name: 构建 APK
        env:
          KEYSTORE_PASS: ${{ secrets.KEYSTORE_PASS }}
        run: bash build.sh

      - name: 上传产物
        uses: actions/upload-artifact@v4
        with:
          name: DeepWrite-mobile-apk
          path: out/DeepWrite-mobile.apk
          if-no-files-found: error
          retention-days: 30
