name: Build APK

# 在 GitHub 的 Ubuntu runner 上构建 DeepWrite 手机壳 APK。
# 好处是绕开容器里没有 arm64 aapt2 的限制，且产出物可直接下载分发。
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "src/**"
      - "tools/**"
      - "build.sh"
      - ".github/workflows/build-apk.yml"

permissions:
  contents: read

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: 准备 JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: 检查 Android SDK
        run: |
          SDK="${ANDROID_SDK_ROOT:-$ANDROID_HOME}"
          echo "ANDROID_SDK_ROOT=$SDK" >> "$GITHUB_ENV"
          echo "build-tools:"; ls "$SDK/build-tools"
          echo "platforms:";   ls "$SDK/platforms"

      - name: 还原签名密钥
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            printf '%s' "$KEYSTORE_BASE64" | base64 -d > deepwrite.keystore
            echo "已还原仓库签名密钥（同仓库的后续版本可覆盖升级）"
          else
            echo "没有配置 KEYSTORE_BASE64：本次会用临时密钥签名，只能全新安装。"
            echo "要固定签名，把 keystore 用 base64 存进仓库 secret 即可。"
          fi

      - name: 构建 APK
        env:
          KEYSTORE_PASS: ${{ secrets.KEYSTORE_PASS }}
        run: bash build.sh

      - name: 上传产物
        uses: actions/upload-artifact@v4
        with:
          name: DeepWrite-mobile-apk
          path: out/DeepWrite-mobile.apk
          if-no-files-found: error
          retention-days: 30
